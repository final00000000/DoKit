buildscript {
    apply from: "../config.gradle"

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/public/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        if (needKotlinV14()) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.android["kotlin_version_v14"]}"
        } else {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.android["kotlin_version_v13"]}"
        }
    }
}

apply plugin: 'kotlin'

/**
 * buildSrc is evaluated before the root project, so it needs its own repositories.
 */
repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/public/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

sourceSets {
    main {
        java {
            srcDirs += []
        }
        kotlin {
            srcDirs += ['src/main/kotlin', 'src/main/java']
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = "17"
}

dependencies {
    compileOnly localGroovy()
    compileOnly gradleApi()

    implementation "com.android.tools.build:gradle:${rootProject.ext.android["agp_plugin_verson"]}"
    // buildSrc's runtime classpath is visible to every project build script;
    // pin KGP to the configured version so AGP's transitive copy does not win.
    implementation "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.android["kotlin_version_v13"]}"
    implementation "org.ow2.asm:asm:9.9"
    implementation "org.ow2.asm:asm-tree:9.9"
}
