apply plugin: 'kotlin'
apply from: '../upload.gradle'

sourceSets {
    main {
        java {
            srcDirs += []
        }
        kotlin {
            // buildSrc is the canonical plugin source; this module packages it for publishing.
            srcDirs = ['../buildSrc/src/main/kotlin']
        }
    }


}

compileKotlin {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_17
}


dependencies {
    compileOnly gradleApi()
    compileOnly localGroovy()

    //版本不能太高 否则会跟项目的as版本冲突
    compileOnly "com.android.tools.build:gradle:${rootProject.ext.android["agp_plugin_verson"]}"
    implementation "org.ow2.asm:asm:9.9"
    implementation "org.ow2.asm:asm-tree:9.9"
}

/**
 * 删除指定目录下的文件
 */
task deleteSource(type: Delete) {
    doLast {
        delete './src/main/kotlin'
    }
}




repositories {
    google()
    mavenCentral()
}



